
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Configure NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Install Macroquad APK builder
        run: cargo install cargo-quad-apk

      - name: Prepare assets
        run: |
          mkdir -p assets/photos

          curl -fL \
            "https://raw.githubusercontent.com/wmgeolab/geoBoundaries/main/releaseData/gbOpen/UKR/ADM1/geoBoundaries-UKR-ADM1.geojson" \
            -o assets/regions.geojson

          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            assets/DejaVuSans.ttf

          if [ -f "assets/photos/беспилотник.png" ]; then
            mv "assets/photos/беспилотник.png" \
               "assets/photos/drone.png"
          fi

      - name: Build APK
        run: cargo quad-apk build --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trivoga-BPLA-STAN
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error
          retention-days: 14

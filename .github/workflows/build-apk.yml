name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Prepare map
        run: |
          mkdir -p assets/photos

          curl -fL \
            "https://raw.githubusercontent.com/wmgeolab/geoBoundaries/main/releaseData/gbOpen/UKR/ADM1/geoBoundaries-UKR-ADM1.geojson" \
            -o assets/regions.geojson

      - name: Prepare font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            assets/DejaVuSans.ttf

      - name: Rename drone image if present
        run: |
          if [ -f "assets/photos/беспилотник.png" ]; then
            mv "assets/photos/беспилотник.png" \
               "assets/photos/drone.png"
          fi

      - name: Build APK
        run: |
          cargo apk build --release \
            --target aarch64-linux-android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trivoga-BPLA-STAN
          path: target/**/*.apk
          if-no-files-found: error
          retention-days: 14
